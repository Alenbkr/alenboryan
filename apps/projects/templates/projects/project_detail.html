{% extends "main/base.html" %}
{% load static %}

{% block title %}{{ project.title }}{% endblock %}

{% block content %}
<a href="{% url 'projects' %}" class="btn-ghost" style="margin-bottom:16px;">← Back</a>

<section class="project-detail">
  <h1 class="section-title">{{ project.title }}</h1>
  <p class="section-subtitle">{{ project.category }}</p>

  <div class="project-body">
    <p>{{ project.description }}</p>
  </div>

  {% if project.image %}
    <img src="{{ project.image.url }}" class="project-image">
  {% endif %}
</section>
{% endblock %}
